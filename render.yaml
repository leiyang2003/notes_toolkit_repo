services:
  - type: web
    name: notes-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    disk:
      name: notes-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: NOTES_VAULT_ROOT
        value: /data/notes_vault
      - key: HOST
        value: 0.0.0.0
      - key: PROCESS_INTERVAL
        value: "120"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_APP_URL
        sync: false
      - key: COOKIE_SAMESITE
        value: None
      - key: COOKIE_SECURE
        value: "true"
  - type: web
    name: notes-frontend-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    autoDeploy: true
    envVars:
      - key: BACKEND_BASE_URL
        sync: false
