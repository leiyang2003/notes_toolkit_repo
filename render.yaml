services:
  - type: web
    name: notes-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    disk:
      name: notes-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: NOTES_VAULT_ROOT
        value: /data/notes_vault
      - key: HOST
        value: 0.0.0.0
      - key: PROCESS_INTERVAL
        value: "120"
      - key: GOOGLE_CLIENT_ID
        sync: false
